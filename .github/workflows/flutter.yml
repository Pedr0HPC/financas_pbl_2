name: AP2B - Testes e APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Conferir ferramentas
        run: |
          flutter --version
          flutter doctor -v

      - name: Instalar dependencias
        run: flutter pub get

      - name: Validar analise estatica
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK de demonstracao
        run: flutter build apk --debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: financas-pbl-ap2b-tema06-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
